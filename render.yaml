services:
  # 1. Backend Web Service (Node.js API)
  - type: web
    name: samaj-portal-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        value: postgresql://samaj_admin:7AHyHAKs9MBrfE3cGmw6PlxjqRSMa72b@dpg-darvh1m0tbcc73d7ue60-a.singapore-postgres.render.com/samaj_portal?sslmode=require
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: STORAGE_PROVIDER
        value: LOCAL

  # 2. Frontend Static Site (React + Vite Web App)
  - type: static
    name: samaj-portal-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://samaj-portal-api.onrender.com/api/v1
